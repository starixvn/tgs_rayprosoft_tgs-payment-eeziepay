apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "eeziepay.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}"
      },
      "EeziePay": {
        "PaymentApiUrl": "{{ .Values.paymentApiUrl  }}",
        "NatsUrl": "{{ .Values.nats }}",
        "CallbackBaseUrl": "{{ .Values.callbackBaseUrl }}"
      }
    }
